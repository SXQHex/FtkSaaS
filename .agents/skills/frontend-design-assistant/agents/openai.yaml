interface:
  display_name: frontend design assistant
  short_description: Frontend design assistant for users with zero/low-code background.
    This skill should be used when users request creating web interfaces, landing
    pages, dashboards, or any frontend UI; when users ask about frontend terminology,
    design elements, or architecture concepts; when users want to understand CSS,
    layout, typography, or color choices. Emphasizes distinctive aesthetics over generic
    AI-generated designs, teaches concepts in context, and adapts to user skill level
    (pure HTML/CSS or React/Vue).
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
