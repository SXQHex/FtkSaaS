name: Candidate full clean
on:
  pull_request:
    types: [labeled]
defaults:
  run:
    working-directory: apps/backend
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: candidate-full-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    if: github.event.label.name == 'ci:full-clean' && github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'development')
    runs-on: ubuntu-24.04
    outputs:
      eligible: ${{ steps.candidate.outputs.eligible }}
      merge: ${{ steps.candidate.outputs.merge }}
      binding: ${{ steps.candidate.outputs.binding }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Resolve candidate
        id: candidate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const source=await import(`${process.env.GITHUB_WORKSPACE}/apps/backend/scripts/ci/source.mjs`);
            await source.resolveCandidate(github,context,core,'full');
  clean:
    needs: candidate
    if: needs.candidate.outputs.eligible == 'true'
    uses: ./.github/workflows/clean-suite.yml
    with:
      tested_sha: ${{ needs.candidate.outputs.merge }}
      binding: ${{ needs.candidate.outputs.binding }}
