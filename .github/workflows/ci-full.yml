name: Backend CI
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Manual full · {0}', inputs.tested_sha) || format('PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.head.sha) }}
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Exact commit SHA for diagnostic full clean (run from main)
        required: true
        type: string
defaults:
  run:
    working-directory: apps/backend
permissions: {}
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('backend-manual-{0}', inputs.tested_sha) || format('backend-pr-{0}-{1}', github.event.pull_request.number, github.event.action == 'edited' && github.event.changes.base == null && 'metadata' || 'source') }}
  cancel-in-progress: true
jobs:
  quality:
    needs: candidate
    permissions:
      contents: read
    if: github.event_name == 'pull_request' && needs.candidate.outputs.kind != 'sandbox' && (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Verify quality source
        run: node apps/backend/scripts/ci/quality-proof.mjs
      # Docs-only checks stay dependency-free; the same command is the Turbo quality task.
      - name: Quality floor
        env:
          QUALITY_BASE: ${{ github.event.pull_request.base.sha }}
        run: node apps/backend/scripts/ci/check-quality.mjs
      - name: Install pinned secret scanner
        run: bash apps/backend/scripts/ci/install-gitleaks.sh "$RUNNER_TEMP/ftk-gitleaks"
      - name: Secret scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          "$RUNNER_TEMP/ftk-gitleaks/gitleaks" git . --redact=100 --no-banner
          --ignore-gitleaks-allow --gitleaks-ignore-path /dev/null
          --config apps/backend/scripts/ci/gitleaks.toml
          --log-opts="$BASE_SHA..$HEAD_SHA"
      - name: Upload quality binding
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-binding
          overwrite: true
          path: .artifacts/ci/quality/binding.json
          include-hidden-files: true
          if-no-files-found: error
          archive: true
  candidate:
    permissions:
      actions: read
      contents: read
      pull-requests: read
    # GitHub exposes retargeting as edited; title/body edits start no jobs.
    if: github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      merge: ${{ steps.candidate.outputs.merge }}
      kind: ${{ steps.candidate.outputs.kind }}
      binding: ${{ steps.candidate.outputs.binding }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Resolve candidate
        id: candidate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const source=await import(`${process.env.GITHUB_WORKSPACE}/apps/backend/scripts/ci/source.mjs`);
            await source.resolveCandidate(github,context,core,'auto');
      - name: Preserve frozen candidate schedule
        if: steps.candidate.outputs.kind == 'full' && github.run_attempt == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-source
          path: .artifacts/ci/candidate-source.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          archive: true
  manual:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tested_sha: ${{ steps.plan.outputs.tested_sha }}
      binding: ${{ steps.plan.outputs.binding }}
    steps:
      # Dispatch orchestration is always the event's main SHA; target files are data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Plan manual full clean
        id: plan
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const manual=await import(`${process.env.GITHUB_WORKSPACE}/apps/backend/scripts/ci/manual-full.mjs`);
            await manual.resolveManualFull(github,context,core);
      - name: Preserve frozen manual schedule
        if: github.run_attempt == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manual-source
          path: .artifacts/ci/manual-source.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          archive: true
  clean:
    permissions:
      contents: read
      actions: read
    needs: [candidate, manual]
    # One source job is deliberately skipped; neither failed source can start clean.
    if: always() && !cancelled() && (needs.candidate.outputs.kind == 'full' && needs.candidate.result == 'success' || needs.manual.result == 'success')
    uses: ./.github/workflows/clean-suite.yml
    with:
      tested_sha: ${{ needs.candidate.outputs.merge || needs.manual.outputs.tested_sha }}
      binding: ${{ needs.candidate.outputs.binding || needs.manual.outputs.binding }}
  documentation:
    permissions:
      contents: read
    needs: candidate
    if: needs.candidate.outputs.kind == 'documentation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.merge }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tested merge
        env:
          EXPECTED: ${{ needs.candidate.outputs.merge }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Documentation acceptance
        run: node scripts/ci/docs-check.mjs README.md
      - name: Record documentation binding
        env:
          BINDING: ${{ needs.candidate.outputs.binding }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {currentAttemptBinding} from './scripts/ci/source.mjs';
          const context={runId:Number(process.env.GITHUB_RUN_ID),sha:process.env.GITHUB_SHA,payload:JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'))};
          const binding=currentAttemptBinding(JSON.parse(process.env.BINDING),context);
          fs.mkdirSync('../../.artifacts/ci',{recursive:true});
          fs.writeFileSync('../../.artifacts/ci/binding.json',JSON.stringify(binding));
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: document-binding-${{ github.run_attempt }}
          path: .artifacts/ci/binding.json
          include-hidden-files: true
          if-no-files-found: error
          archive: true
