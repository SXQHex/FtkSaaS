name: Manual targeted
run-name: 'Targeted · ${{ inputs.base_sha }} → ${{ inputs.tested_sha }}'
on:
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Exact commit to test (40-character SHA)
        required: true
        type: string
      base_sha:
        description: Exact ancestor base (use parent SHA for one commit)
        required: true
        type: string
env:
  FTK_MANUAL_SOURCE_ROOT: ${{ github.workspace }}/source
permissions:
  contents: read
concurrency:
  group: manual-targeted-${{ inputs.base_sha }}-${{ inputs.tested_sha }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: source/apps/backend
jobs:
  selection:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      plan: ${{ steps.plan.outputs.plan }}
      setup: ${{ steps.plan.outputs.setup }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: policy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: 'source/.nvmrc'
      - name: Select exact range
        id: plan
        env:
          BASE: ${{ inputs.base_sha }}
          HEAD: ${{ inputs.tested_sha }}
        run: |
          node "$GITHUB_WORKSPACE/policy/apps/backend/scripts/ci/manual-targeted.mjs" plan "$BASE" "$HEAD"
          node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'plan='+JSON.stringify(JSON.parse(require('fs').readFileSync('../../.artifacts/ci/selection.json')))+'\n')"
  core:
    needs: selection
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: policy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: 'source/.nvmrc'
      - if: needs.selection.outputs.setup == 'true'
        run: corepack enable
      - if: needs.selection.outputs.setup == 'true'
        run: pnpm install --frozen-lockfile
        working-directory: source
      - name: Selected core and DB tests
        env:
          BASE: ${{ inputs.base_sha }}
          HEAD: ${{ inputs.tested_sha }}
          PLAN: ${{ needs.selection.outputs.plan }}
        run: |
          mkdir -p ../../.artifacts/ci
          node -e "require('fs').writeFileSync('../../.artifacts/ci/selection.json',process.env.PLAN)"
          node "$GITHUB_WORKSPACE/policy/apps/backend/scripts/ci/manual-targeted.mjs" core "$BASE" "$HEAD"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: targeted-core-${{ github.run_attempt }}
          path: |
            source/.artifacts/ci/selection.json
            source/.artifacts/ci/timings/*.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
          archive: true
  api:
    name: targeted-api-${{ matrix.shard }}
    needs: selection
    if: fromJSON(needs.selection.outputs.matrix).include[0].shard != 0
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: policy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: 'source/.nvmrc'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - name: Selected API shard
        env:
          BASE: ${{ inputs.base_sha }}
          HEAD: ${{ inputs.tested_sha }}
          SHARD: ${{ matrix.shard }}
          PLAN: ${{ needs.selection.outputs.plan }}
        run: |
          mkdir -p ../../.artifacts/ci
          node -e "require('fs').writeFileSync('../../.artifacts/ci/selection.json',process.env.PLAN)"
          node "$GITHUB_WORKSPACE/policy/apps/backend/scripts/ci/manual-targeted.mjs" api "$BASE" "$HEAD" "$SHARD"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: targeted-api-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            source/.artifacts/ci/selection.json
            source/.artifacts/ci/timings/*.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
          archive: true
  summary:
    needs: [selection, core, api]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Diagnostic result (not merge acceptance)
        working-directory: .
        env:
          SELECTION: ${{ needs.selection.result }}
          CORE: ${{ needs.core.result }}
          API: ${{ needs.api.result }}
          MATRIX: ${{ needs.selection.outputs.matrix }}
        run: |
          node - <<'JS'
          const {SELECTION,CORE,API,MATRIX}=process.env;
          const noApi=JSON.parse(MATRIX||'{"include":[]}').include[0]?.shard===0;
          if(SELECTION!=='success'||CORE!=='success'||API!==(noApi?'skipped':'success'))throw Error('Manual targeted failed/incomplete');
          JS
          echo 'Diagnostic only; not full clean or merge/main acceptance.' >> "$GITHUB_STEP_SUMMARY"
