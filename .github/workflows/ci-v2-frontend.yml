name: CI V2 Frontend
on:
  workflow_call:
permissions: {}
concurrency:
  group: ci-v2-frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Frontend Build And Tests
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    outputs:
      build_id: ${{ steps.build-upload.outputs.artifact-id }}
      build_sha256: ${{ steps.build-package.outputs.sha256 }}
      build_attempt: ${{ steps.build-package.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Validate Manual Source
        run: node apps/backend/scripts/ci/v2/local.mjs preflight
      - name: Install Frozen Dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
      - name: Frontend Quality And Build
        run: pnpm exec turbo run lint typecheck build test:coverage --filter=@ftksaas/web --filter=@ftksaas/ui
      - name: Verify Workspace Isolation
        run: pnpm --filter @ftksaas/web test:isolation
      - name: Package Verified Build
        id: build-package
        run: node apps/web/scripts/ci-build.mjs package
      - name: Upload Verified Build
        id: build-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-v2-frontend-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/frontend-build/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          archive: true
      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-v2-frontend-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/coverage
            packages/ui/coverage
          if-no-files-found: ignore
          retention-days: 7
          archive: true
  browsers:
    name: Frontend ${{ matrix.browser }}
    needs: checks
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Validate Manual Source
        run: node apps/backend/scripts/ci/v2/local.mjs preflight
      - name: Install Frozen Dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
      - name: Install Selected Browser
        env:
          BROWSER: ${{ matrix.browser == 'mobile' && 'webkit' || matrix.browser }}
        run: pnpm --filter @ftksaas/web exec playwright install --with-deps "$BROWSER"
      - name: Download Verified Build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.checks.outputs.build_id }}
          path: .artifacts/frontend-build/
          merge-multiple: true
          digest-mismatch: error
      - name: Verify And Restore Build
        env:
          EXPECTED_BUILD_SHA256: ${{ needs.checks.outputs.build_sha256 }}
          EXPECTED_BUILD_ATTEMPT: ${{ needs.checks.outputs.build_attempt }}
        run: node apps/web/scripts/ci-build.mjs restore
      - name: Test Selected Browser
        env:
          BROWSER_PROJECT: ${{ matrix.browser }}
        run: pnpm --filter @ftksaas/web exec playwright test --project="$BROWSER_PROJECT"
      - name: Upload Browser Diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-v2-frontend-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/frontend/
          if-no-files-found: ignore
          retention-days: 7
          archive: true
