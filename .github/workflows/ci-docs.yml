name: Documentation acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, unlabeled]
defaults:
  run:
    working-directory: apps/backend
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: documentation-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true
jobs:
  classify:
    if: github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'development')
    runs-on: ubuntu-24.04
    outputs:
      eligible: ${{ steps.scope.outputs.eligible }}
      merge: ${{ steps.scope.outputs.merge }}
      binding: ${{ steps.scope.outputs.binding }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            if(!require('fs').existsSync(`${process.env.GITHUB_WORKSPACE}/apps/backend/scripts/ci/source.mjs`)){
              core.setOutput('eligible','false');
              await core.summary.addRaw('Documentation policy not installed on trusted base; no documentation acceptance granted.').write();
              return;
            }
            const source=await import(`${process.env.GITHUB_WORKSPACE}/apps/backend/scripts/ci/source.mjs`);
            await source.resolveCandidate(github,context,core,'documentation');
  documentation:
    needs: classify
    if: needs.classify.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.classify.outputs.merge }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tested merge
        env:
          EXPECTED: ${{ needs.classify.outputs.merge }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.nvmrc'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Documentation acceptance
        run: |
          node scripts/ci/docs-check.mjs README.md
          pnpm --dir ../.. run verify
      - name: Record documentation binding
        env:
          BINDING: ${{ needs.classify.outputs.binding }}
        run: |
          mkdir -p ../../.artifacts/ci
          node -e "require('fs').writeFileSync('../../.artifacts/ci/binding.json',process.env.BINDING)"
          echo 'Documentation acceptance only; no full clean executed.' >> "$GITHUB_STEP_SUMMARY"
          cat ../../.artifacts/ci/binding.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: document-binding-${{ github.run_attempt }}
          path: .artifacts/ci/binding.json
          if-no-files-found: error
          include-hidden-files: true
          archive: true
