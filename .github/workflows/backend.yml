name: Main clean acceptance
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: main-acceptance-${{ github.sha }}
  cancel-in-progress: false
jobs:
  main-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          persist-credentials: false
      - name: Verify merged candidate relation
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const gate=await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/gate.mjs`);
            await gate.verifyMerged(github,context,core);
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; Node 24
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm run test:clean
        env:
          FTK_TEST_TIMINGS: '1'
      - if: always()
        run: node scripts/ci/summarize-timings.mjs
      - if: always()
        run: npm run dev:stop
