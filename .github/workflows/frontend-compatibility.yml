name: Frontend contract compatibility
on:
  pull_request:
    paths:
      - 'packages/api-contracts/**'
      - 'packages/typescript-config/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.nvmrc'
      - '.github/workflows/frontend-compatibility.yml'
  push:
    branches: [main]
    paths:
      - 'packages/api-contracts/**'
      - 'packages/typescript-config/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.nvmrc'
      - '.github/workflows/frontend-compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.nvmrc'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run typecheck --filter=@ftksaas/web --filter=@ftksaas/ui
      - run: pnpm --filter @ftksaas/web test:isolation
