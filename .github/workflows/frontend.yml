name: Frontend checks
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions: {}
env:
  VITE_SUPABASE_URL: http://127.0.0.1:4175
  VITE_SUPABASE_PUBLISHABLE_KEY: public-test-key
concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base == null && 'metadata' || 'source' }}
  cancel-in-progress: true
jobs:
  scope:
    permissions:
      contents: read
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      e2e_base: ${{ steps.scope.outputs.e2e_base }}
      e2e_specs: ${{ steps.scope.outputs.e2e_specs }}
      e2e_matrix: ${{ steps.scope.outputs.e2e_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Select frontend scope
        id: scope
        run: node apps/web/scripts/ci-scope.mjs
      - name: Record candidate source
        if: github.event_name == 'pull_request'
        run: node apps/web/scripts/ci-proof.mjs frontend
      - name: Upload candidate source
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-source-frontend-${{ github.run_attempt }}
          path: .artifacts/ci/frontend-source.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          archive: true
  checks:
    permissions:
      contents: read
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      build_id: ${{ steps.build-upload.outputs.artifact-id }}
      build_sha256: ${{ steps.build-package.outputs.sha256 }}
      build_attempt: ${{ steps.build-package.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - run: |
          set -euo pipefail
          corepack_bin="$(bash "$GITHUB_WORKSPACE/apps/backend/scripts/ci/install-corepack.sh" "$RUNNER_TEMP/corepack")"
          PATH="$corepack_bin:$PATH" corepack enable --install-directory "$(dirname "$(command -v node)")" pnpm
      - run: pnpm install --frozen-lockfile
      - name: Frontend checks, coverage and build
        run: pnpm exec turbo run lint typecheck build test:coverage --filter=@ftksaas/web --filter=@ftksaas/ui
      - run: pnpm --filter @ftksaas/web test:isolation
      - name: Verify frontend test and translation checks
        run: pnpm --filter @ftksaas/web test:ci:guards && pnpm --filter @ftksaas/web i18n:check
      - name: Package verified build
        id: build-package
        run: node apps/web/scripts/ci-build.mjs package
      - name: Upload verified build
        id: build-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/frontend-build/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          archive: true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: |
            apps/web/coverage
            packages/ui/coverage
          if-no-files-found: ignore
  browsers:
    name: browsers (${{ matrix.profile }}, ${{ matrix.shard }})
    permissions:
      contents: read
    needs: [scope, checks]
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.e2e_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - run: |
          set -euo pipefail
          corepack_bin="$(bash "$GITHUB_WORKSPACE/apps/backend/scripts/ci/install-corepack.sh" "$RUNNER_TEMP/corepack")"
          PATH="$corepack_bin:$PATH" corepack enable --install-directory "$(dirname "$(command -v node)")" pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare Ubuntu package sources
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          sudo -- "$(command -v node)" apps/web/scripts/ci-apt.mjs
      - name: Install selected browser
        timeout-minutes: 8
        env:
          BROWSER: ${{ matrix.engine }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @ftksaas/web exec node scripts/playwright.mjs install --with-deps "$BROWSER"
      # Exact artifact ID/output binding also supports a retained checks job on rerun.
      - name: Download verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.checks.outputs.build_id }}
          path: .artifacts/frontend-build/
          merge-multiple: true
          digest-mismatch: error
      - name: Verify and restore build
        env:
          EXPECTED_BUILD_SHA256: ${{ needs.checks.outputs.build_sha256 }}
          EXPECTED_BUILD_ATTEMPT: ${{ needs.checks.outputs.build_attempt }}
        run: node apps/web/scripts/ci-build.mjs restore
      - name: Test selected browser
        env:
          FTK_BROWSER_PROJECT: ${{ matrix.profile }}
          FTK_BROWSER_SHARD: ${{ matrix.shard }}
          FTK_E2E_SPECS: ${{ needs.scope.outputs.e2e_specs }}
          TURBO_SCM_BASE: ${{ needs.scope.outputs.e2e_base }}
          TURBO_SCM_HEAD: ${{ github.sha }}
        run: |
          report=apps/web/test-reports/playwright.json
          rm -f "$report"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            pnpm exec turbo run test:e2e:ci --filter=@ftksaas/web --log-order=stream
          else
            pnpm exec turbo run test:e2e:ci --filter=@ftksaas/web --affected --log-order=stream
            if [[ ! -f "$report" ]]; then
              echo "The exact-source scope requires tests even though Turbo selected no package tasks."
              pnpm exec turbo run test:e2e:ci --filter=@ftksaas/web --log-order=stream
            fi
          fi
      - name: Verify browser shard ran
        run: node apps/web/scripts/check-test-results.mjs playwright apps/web/test-reports/playwright.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-browser-${{ matrix.profile }}-${{ matrix.shard }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
            apps/web/test-reports/playwright.*
          if-no-files-found: ignore
