name: Frontend checks
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions: {}
concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base == null && 'metadata' || 'source' }}
  cancel-in-progress: true
jobs:
  scope:
    permissions:
      contents: read
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Select frontend scope
        id: scope
        run: node apps/web/scripts/ci-scope.mjs
      - name: Record candidate source
        if: github.event_name == 'pull_request'
        run: node apps/web/scripts/ci-proof.mjs frontend
      - name: Upload candidate source
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-source-frontend-${{ github.run_attempt }}
          path: .artifacts/ci/frontend-source.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          archive: true
  checks:
    permissions:
      contents: read
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      build_id: ${{ steps.build-upload.outputs.artifact-id }}
      build_sha256: ${{ steps.build-package.outputs.sha256 }}
      build_attempt: ${{ steps.build-package.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Frontend checks, coverage and build
        run: pnpm exec turbo run lint typecheck build test:coverage --filter=@ftksaas/web --filter=@ftksaas/ui
      - run: pnpm --filter @ftksaas/web test:isolation
      - name: Package verified build
        id: build-package
        run: node apps/web/scripts/ci-build.mjs package
      - name: Upload verified build
        id: build-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/frontend-build/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          archive: true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: |
            apps/web/coverage
            packages/ui/coverage
          if-no-files-found: ignore
  browsers:
    permissions:
      contents: read
    needs: [scope, checks]
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Install selected browser
        env:
          BROWSER: ${{ matrix.browser == 'mobile' && 'webkit' || matrix.browser }}
        run: pnpm --filter @ftksaas/web exec playwright install --with-deps "$BROWSER"
      # Exact artifact ID/output binding also supports a retained checks job on rerun.
      - name: Download verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.checks.outputs.build_id }}
          path: .artifacts/frontend-build/
          merge-multiple: true
          digest-mismatch: error
      - name: Verify and restore build
        env:
          EXPECTED_BUILD_SHA256: ${{ needs.checks.outputs.build_sha256 }}
          EXPECTED_BUILD_ATTEMPT: ${{ needs.checks.outputs.build_attempt }}
        run: node apps/web/scripts/ci-build.mjs restore
      - name: Test selected browser
        env:
          BROWSER_PROJECT: ${{ matrix.browser }}
        run: pnpm --filter @ftksaas/web exec playwright test --project="$BROWSER_PROJECT"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-browser-${{ matrix.browser }}
          path: .artifacts/frontend/
          if-no-files-found: ignore
