name: CI V2 Pilot
run-name: 'Room pilot · ${{ github.sha }}'
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-v2-room-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: apps/backend
jobs:
  room-pilot:
    name: V2 Room Diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check disposable source
        run: node scripts/ci/v2/local.mjs preflight
      - name: Check pilot safety
        run: node --test tests/v2/safety.test.mjs
      - name: Install backend dependencies
        working-directory: .
        run: |
          set -euo pipefail
          corepack enable
          pnpm --filter @ftksaas/backend... --filter ftksaas install --frozen-lockfile
      - name: Prepare isolated backend
        run: node scripts/ci/v2/local.mjs prepare
      - name: Run room pilot
        env:
          FTK_EDGE_MEMORY_GUARD: '1'
        run: >-
          node scripts/ci/observe-api.mjs node --test --test-concurrency=1
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination=../../.artifacts/ci-v2/room.junit.xml
          tests/v2/room.test.mjs
      - name: Stop owned backend
        if: always()
        run: node scripts/ci/v2/local.mjs cleanup
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-v2-room-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ci-v2/
          if-no-files-found: warn
          retention-days: 7
          archive: true
      - name: Explain diagnostic scope
        if: always()
        run: |
          set -euo pipefail
          printf '%s\n' 'Room pilot only. This run is not full clean, merge acceptance or deployment authorization.' >> "$GITHUB_STEP_SUMMARY"
