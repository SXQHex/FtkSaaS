name: CI V2 Backend
run-name: 'Twenty backend shards · ${{ github.sha }}'
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-v2-backend-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: apps/backend
jobs:
  inventory:
    name: V2 Backend Inventory
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Verify disposable source
        run: node scripts/ci/v2/local.mjs preflight
      - name: Install backend dependencies
        working-directory: .
        run: |
          set -euo pipefail
          corepack enable
          pnpm --filter @ftksaas/backend... --filter ftksaas install --frozen-lockfile
      - name: Verify backend and migration parity
        run: |
          set -euo pipefail
          pnpm run verify
          node --test tests/v2/backend.test.mjs tests/v2/safety.test.mjs tests/v2/scope.test.mjs tests/v2/plan.test.mjs
      - name: Plan twenty nonempty shards
        id: plan
        run: node scripts/ci/v2/backend.mjs plan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-v2-backend-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ci-v2/backend-plan.json
          if-no-files-found: error
          retention-days: 7
          archive: true
  backend:
    name: V2 Backend ${{ matrix.shard }}
    needs: inventory
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    env:
      CI_V2_BACKEND_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Verify disposable source
        run: node scripts/ci/v2/local.mjs preflight
      - name: Install backend dependencies
        working-directory: .
        run: |
          set -euo pipefail
          corepack enable
          pnpm --filter @ftksaas/backend... --filter ftksaas install --frozen-lockfile
      - name: Prepare isolated backend
        run: node scripts/ci/v2/local.mjs prepare
      - name: Run direct backend suites
        env:
          FTK_EDGE_MEMORY_GUARD: '1'
        run: node scripts/ci/observe-api.mjs node scripts/ci/v2/backend.mjs "$CI_V2_BACKEND_SHARD"
      - name: Stop owned backend
        if: always()
        run: node scripts/ci/v2/local.mjs cleanup
      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-v2-backend-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/ci-v2/
            .artifacts/ci/diagnostics/*.jsonl
          if-no-files-found: warn
          retention-days: 7
          archive: true
  summary:
    name: V2 Backend Diagnostic
    needs: [inventory, backend]
    if: always()
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Require complete shadow execution
        env:
          INVENTORY: ${{ needs.inventory.result }}
          BACKEND: ${{ needs.backend.result }}
        run: |
          set -euo pipefail
          test "$INVENTORY" = success
          test "$BACKEND" = success
          printf '%s\n' 'Twenty backend shadow shards succeeded. This is not production merge/CD acceptance.' >> "$GITHUB_STEP_SUMMARY"
