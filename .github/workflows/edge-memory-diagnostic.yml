name: Edge memory A-B diagnostic
on:
  push:
    branches: [diagnostic/edge-memory-ab]
permissions: {}
concurrency:
  group: edge-memory-diagnostic
  cancel-in-progress: false
jobs:
  measure:
    name: memory-${{ matrix.policy }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        policy: [per_worker, oneshot]
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Fixed workload and bounded memory observation
        env:
          POLICY: ${{ matrix.policy }}
          DO_NOT_TRACK: '1'
        run: node scripts/ci/edge-memory-ab.mjs "$POLICY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: edge-memory-${{ matrix.policy }}-${{ github.run_attempt }}
          path: |
            .artifacts/ci/edge-memory/**/*.jsonl
            .artifacts/ci/edge-memory/**/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          archive: true
