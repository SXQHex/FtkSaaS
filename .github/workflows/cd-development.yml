name: Development delivery
run-name: 'Development delivery · ${{ github.event.workflow_run.head_sha || inputs.acceptance_run_id }}'
on:
  workflow_run:
    workflows: [Main acceptance]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      acceptance_run_id:
        description: Successful full main acceptance run for current main (never a PR run)
        required: true
        type: string
defaults:
  run:
    working-directory: apps/backend
permissions: {}
concurrency:
  group: supabase-development-gwyprhenabtpkbojephw
  cancel-in-progress: false
jobs:
  source:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.source.outputs.deploy }}
      sha: ${{ steps.source.outputs.sha }}
      acceptance_run_id: ${{ steps.source.outputs.acceptance_run_id }}
      acceptance_attempt: ${{ steps.source.outputs.acceptance_attempt }}
      expected_main: ${{ steps.source.outputs.expected_main }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const cd=await import(`${process.env.GITHUB_WORKSPACE}/apps/backend/scripts/ci/deployment-source.mjs`);
            await cd.resolveDeployment(github,context,core);
  deploy:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    needs: source
    if: needs.source.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - run: corepack enable
      - run: pnpm --filter @ftksaas/backend... --filter ftksaas install --frozen-lockfile
        working-directory: .
      - name: Read previous successful delivery receipt
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const cd=await import(`${process.env.GITHUB_WORKSPACE}/apps/backend/scripts/ci/deployment-source.mjs`);
            await cd.previousReceipt(github,context);
      - name: Deliver accepted source and verify hosted backend
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTED_SHA: ${{ needs.source.outputs.sha }}
          ACCEPTANCE_RUN_ID: ${{ needs.source.outputs.acceptance_run_id }}
          ACCEPTANCE_ATTEMPT: ${{ needs.source.outputs.acceptance_attempt }}
          EXPECTED_MAIN_SHA: ${{ needs.source.outputs.expected_main }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_NATIVE_DEPLOY_DISABLED: ${{ vars.SUPABASE_NATIVE_DEPLOY_DISABLED }}
        run: node scripts/ci/deploy-development.mjs
      - name: Read exact accepted candidate schema baseline
        id: docs-baseline
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          ACCEPTED_SHA: ${{ needs.source.outputs.sha }}
          ACCEPTANCE_RUN_ID: ${{ needs.source.outputs.acceptance_run_id }}
        with:
          script: |
            const gate=await import(`${process.env.GITHUB_WORKSPACE}/apps/backend/scripts/ci/gate.mjs`);
            const b=await gate.verifyMerged(github,{repo:context.repo,sha:process.env.ACCEPTED_SHA,runId:Number(process.env.ACCEPTANCE_RUN_ID)},core);
            if(b.kind!=='full')throw Error('Documentation needs source-bound full acceptance');
            const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{...context.repo,run_id:b.run_id,per_page:100});
            const found=artifacts.filter(a=>!a.expired&&a.name===gate.schemaBaselineName(b));
            if(found.length!==1)throw Error('Missing/ambiguous source-bound schema baseline');
            const zip=await github.rest.actions.downloadArtifact({...context.repo,artifact_id:found[0].id,archive_format:'zip'});
            const fs=await import('node:fs'),os=await import('node:os'),path=await import('node:path'),cp=await import('node:child_process');
            const dir=fs.mkdtempSync(path.join(os.tmpdir(),'ftk-docs-'));
            try{
              const archive=path.join(dir,'baseline.zip');fs.writeFileSync(archive,Buffer.from(zip.data));
              const text=cp.execFileSync('unzip',['-p',archive,'schema-baseline.json'],{encoding:'utf8',maxBuffer:20*1024*1024});
              const value=JSON.parse(text);if(value.source!==b.merge)throw Error('Schema baseline tested source mismatch');
              const out=path.join(process.env.GITHUB_WORKSPACE,'.artifacts/docs');fs.mkdirSync(out,{recursive:true});fs.writeFileSync(path.join(out,'schema-baseline.json'),text);
              core.setOutput('sha',b.merge);
            }finally{fs.rmSync(dir,{recursive:true,force:true});}
      - name: Verify and capture deployed documentation
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DOCS_BASELINE_SHA: ${{ steps.docs-baseline.outputs.sha }}
        run: node scripts/capture-docs.mjs --hosted
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-documentation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/docs/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
          archive: true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/ci/development-delivery.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          archive: true
