name: Publish pinned Edge Runtime package
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/edge-runtime-package.yml
      - apps/backend/scripts/ci/xreq-072-runtime.json
  workflow_dispatch:
permissions: {}
concurrency:
  group: edge-runtime-package-${{ github.repository }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read reviewed package pin
        id: pin
        run: |
          pin=apps/backend/scripts/ci/xreq-072-runtime.json
          tag=$(jq -er '.release_tag | select(test("^[a-zA-Z0-9._-]+$"))' "$pin")
          run_id=$(jq -er .run_id "$pin")
          artifact_id=$(jq -er .artifact_id "$pin")
          printf 'tag=%s\nrun_id=%s\nartifact_id=%s\n' "$tag" "$run_id" "$artifact_id" >> "$GITHUB_OUTPUT"
      - name: Check for an existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pin.outputs.tag }}
        run: |
          set -euo pipefail
          # The authenticated listing includes drafts; lookup by tag does not.
          matches=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -cs --arg tag "$TAG" '[.[][] | select(.tag_name == $tag) | .draft]')
          case "$matches" in
            '[]') echo 'state=absent' >> "$GITHUB_OUTPUT" ;;
            '[true]') echo 'state=draft' >> "$GITHUB_OUTPUT" ;;
            '[false]') echo 'state=published' >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
      - name: Fetch previously accepted package
        if: steps.release.outputs.state != 'published'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.pin.outputs.run_id }}
          artifact-ids: ${{ steps.pin.outputs.artifact_id }}
          path: ${{ runner.temp }}/xreq-072-runtime
          digest-mismatch: error
      - name: Verify and publish pinned assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pin.outputs.tag }}
          RELEASE_STATE: ${{ steps.release.outputs.state }}
        run: |
          set -euo pipefail
          pin=apps/backend/scripts/ci/xreq-072-runtime.json
          package_dir="$RUNNER_TEMP/xreq-072-runtime"
          archive=edge-runtime-v1.77.9-r0-linux-amd64.tar.zst
          manifest=edge-runtime-v1.77.9-r0-linux-amd64.manifest.json
          if [[ "$RELEASE_STATE" == published ]]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$package_dir" \
              --pattern "$archive" --pattern "$manifest"
          fi
          checksums=$(jq -er '.assets | to_entries[] | "\(.value)  \(.key)"' "$pin")
          (cd "$package_dir" && sha256sum --check <<< "$checksums")
          if [[ "$RELEASE_STATE" != published ]]; then
            target="$GITHUB_SHA"
            if [[ "$RELEASE_STATE" == draft ]]; then
              target=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')
              [[ "$target" =~ ^[a-f0-9]{40}$ ]]
            fi
            tag_ref="refs/tags/$TAG"
            if refs=$(git ls-remote --exit-code origin "$tag_ref" "$tag_ref^{}"); then
              tag_commit=$(awk -v ref="$tag_ref" '$2 == ref { tag=$1 } $2 == ref "^{}" { peeled=$1 } END { print peeled ? peeled : tag }' <<< "$refs")
              test "$tag_commit" = "$target"
            elif [[ $? != 2 ]]; then
              exit 1
            fi
          fi
          case "$RELEASE_STATE" in
            published) ;;
            draft)
              # Recover an interrupted upload without replacing any existing asset.
              assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
              draft_dir="$RUNNER_TEMP/xreq-072-draft"
              mkdir "$draft_dir"
              while IFS= read -r asset; do
                [[ -z "$asset" || "$asset" == "$archive" || "$asset" == "$manifest" ]]
              done <<< "$assets"
              for asset in "$archive" "$manifest"; do
                if grep -Fxq "$asset" <<< "$assets"; then
                  gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$draft_dir" --pattern "$asset"
                  cmp "$draft_dir/$asset" "$package_dir/$asset"
                else
                  gh release upload "$TAG" "$package_dir/$asset" --repo "$GITHUB_REPOSITORY"
                fi
              done
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
              ;;
            absent)
              gh release create "$TAG" "$package_dir/$archive" "$package_dir/$manifest" \
                --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
                --title 'Verified native Edge Runtime for XREQ-072 CI' \
                --notes "Source, build inputs and SHA-256 pins: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/$pin"
              ;;
            *) exit 1 ;;
          esac
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = false
