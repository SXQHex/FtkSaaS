name: Complete isolated clean
on:
  workflow_call:
    inputs:
      tested_sha:
        required: true
        type: string
      binding:
        required: true
        type: string
defaults:
  run:
    working-directory: apps/backend
permissions: {}
jobs:
  core:
    permissions:
      contents: read
    name: core
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tested merge
        env:
          EXPECTED: ${{ inputs.tested_sha }}
          BINDING: ${{ inputs.binding }}
        run: |
          node --input-type=module - <<'JS'
          import {execFileSync} from 'node:child_process';
          const b=JSON.parse(process.env.BINDING);
          const git=(...a)=>execFileSync('git',a,{encoding:'utf8'}).trim();
          if(git('rev-parse','HEAD')!==process.env.EXPECTED||git('rev-parse','HEAD^{tree}')!==b.tree||(b.actual??b.merge)!==process.env.EXPECTED)throw Error('Source mismatch');
          JS
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Clean acceptance
        env:
          FTK_TEST_TIMINGS: '1'
        run: node scripts/test-clean.mjs core
      - name: Upload schema baseline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Only core writes this run-scoped artifact. Retained core success
          # retains it; a successful re-execution replaces it on the same source.
          name: documentation-baseline
          overwrite: true
          path: .artifacts/docs/schema-baseline.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          archive: true
      - if: always()
        run: node scripts/ci/summarize-timings.mjs
      - if: always()
        run: node scripts/ci/cleanup.mjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-core-${{ github.run_attempt }}
          path: .artifacts/ci/timings/*.json
          if-no-files-found: ignore
          include-hidden-files: true
          archive: true
  api:
    permissions:
      contents: read
    name: api-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tested_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify tested merge
        env:
          EXPECTED: ${{ inputs.tested_sha }}
          BINDING: ${{ inputs.binding }}
        run: |
          node --input-type=module - <<'JS'
          import {execFileSync} from 'node:child_process';
          const b=JSON.parse(process.env.BINDING);
          const git=(...a)=>execFileSync('git',a,{encoding:'utf8'}).trim();
          if(git('rev-parse','HEAD')!==process.env.EXPECTED||git('rev-parse','HEAD^{tree}')!==b.tree||(b.actual??b.merge)!==process.env.EXPECTED)throw Error('Source mismatch');
          JS
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Clean acceptance
        env:
          FTK_TEST_TIMINGS: '1'
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$SHARD" = '1' ]; then
            node scripts/ci/observe-api.mjs node scripts/test-clean.mjs api "$SHARD"
          else
            node scripts/test-clean.mjs api "$SHARD"
          fi
      - if: always()
        run: node scripts/ci/summarize-timings.mjs
      - if: always()
        run: node scripts/ci/cleanup.mjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-api-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            .artifacts/ci/timings/*.json
            .artifacts/ci/diagnostics/*.jsonl
          if-no-files-found: ignore
          include-hidden-files: true
          archive: true
  serial-reference:
    permissions:
      contents: read
    name: serial-reference
    if: fromJSON(inputs.binding).benchmark == true
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tested merge
        env:
          EXPECTED: ${{ inputs.tested_sha }}
          BINDING: ${{ inputs.binding }}
        run: |
          node --input-type=module - <<'JS'
          import {execFileSync} from 'node:child_process';
          const b=JSON.parse(process.env.BINDING);
          const git=(...a)=>execFileSync('git',a,{encoding:'utf8'}).trim();
          if(git('rev-parse','HEAD')!==process.env.EXPECTED||git('rev-parse','HEAD^{tree}')!==b.tree||(b.actual??b.merge)!==process.env.EXPECTED)throw Error('Source mismatch');
          JS
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Clean acceptance
        env:
          FTK_TEST_TIMINGS: '1'
        run: node scripts/test-clean.mjs serial
      - if: always()
        run: node scripts/ci/summarize-timings.mjs
      - if: always()
        run: node scripts/ci/cleanup.mjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-serial-reference-${{ github.run_attempt }}
          path: .artifacts/ci/timings/*.json
          if-no-files-found: ignore
          include-hidden-files: true
          archive: true
  full-clean:
    permissions:
      contents: read
      actions: read
    name: full-clean
    needs: [core, api, serial-reference]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tested_sha }}
          persist-credentials: false
      - name: Verify all required jobs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          BINDING: ${{ inputs.binding }}
        with:
          script: |
            const collector=await import(`${process.env.GITHUB_WORKSPACE}/apps/backend/scripts/ci/collect.mjs`);
            await collector.collect(github,context,core,JSON.parse(process.env.BINDING));
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ fromJSON(inputs.binding).actual && 'main-binding' || 'candidate-binding' }}-${{ github.run_attempt }}
          path: |
            .artifacts/ci/binding.json
            .artifacts/ci/measurements.json
          if-no-files-found: error
          include-hidden-files: true
          archive: true
