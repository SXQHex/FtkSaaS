# INACTIVE TEMPLATE: GitHub only loads workflows from the repository-root .github/workflows.
# Paths below already target the monorepo root; see README before activation.
name: web1 dependency security template
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
permissions: {}
concurrency:
  group: web1-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base == null && 'metadata' || 'source' }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
    working-directory: apps/web1
env:
  CI: "true"
  npm_config_cache: ${{ github.workspace }}/apps/web1/.npm-cache
  TMPDIR: ${{ github.workspace }}/apps/web1/.tmp
  TMP: ${{ github.workspace }}/apps/web1/.tmp
  TEMP: ${{ github.workspace }}/apps/web1/.tmp
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/apps/web1/.playwright-browsers
jobs:
  audit:
    name: web1 npm audit (${{ matrix.scope }})
    if: github.event.action != 'edited' || github.event.changes.base != null
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # npm has no development-only audit. Compare all with production to identify dev exposure.
        scope: [production, all]
    steps:
      - name: Check out the event source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "apps/web1/.nvmrc"
          package-manager-cache: false
      - name: Prepare isolated local paths and verify checkout
        run: |
          mkdir -p "$TMPDIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --version
          npm --version
      - name: Install locked dependencies without lifecycle scripts
        id: install
        run: npm ci --ignore-scripts
      - name: Audit dependencies (findings must fail the job)
        id: audit
        env:
          AUDIT_SCOPE: ${{ matrix.scope }}
        run: npm run "audit:$AUDIT_SCOPE"
      - name: Upload audit diagnostics even when vulnerabilities are found
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web1-audit-${{ matrix.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web1/test-reports/audit-${{ matrix.scope }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Record the actual audit outcome
        if: ${{ !cancelled() }}
        env:
          AUDIT_SCOPE: ${{ matrix.scope }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          printf '### web1 dependency audit (%s)\nAudit step: `%s`\n' "$AUDIT_SCOPE" "$AUDIT_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          printf 'Unresolved findings block security acceptance. Skipped audits are not success.\n' >> "$GITHUB_STEP_SUMMARY"
