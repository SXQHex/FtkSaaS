# INACTIVE TEMPLATE: GitHub only loads workflows from the repository-root .github/workflows.
# Paths below already target the monorepo root; see README before activation.
name: web1 frontend CI template
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions: {}
concurrency:
  group: web1-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base == null && 'metadata' || 'source' }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
    working-directory: apps/web1
env:
  CI: "true"
  npm_config_cache: ${{ github.workspace }}/apps/web1/.npm-cache
  TMPDIR: ${{ github.workspace }}/apps/web1/.tmp
  TMP: ${{ github.workspace }}/apps/web1/.tmp
  TEMP: ${{ github.workspace }}/apps/web1/.tmp
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/apps/web1/.playwright-browsers
jobs:
  verify:
    name: web1 quality and Chromium
    if: github.event.action != 'edited' || github.event.changes.base != null
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the event source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "apps/web1/.nvmrc"
          package-manager-cache: false
      - name: Prepare isolated local paths and verify checkout
        run: |
          mkdir -p "$TMPDIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --version
          npm --version
      - name: Install locked dependencies without lifecycle scripts
        id: install
        run: npm ci --ignore-scripts
      # Only an ephemeral GitHub-hosted runner may install OS packages.
      # This is deliberately separate from browser download; never run it on the developer host.
      - name: Install Chromium Linux system dependencies
        run: npm run test:e2e:deps
      - name: Install pinned Chromium browser
        run: npm run test:e2e:install
      - name: Run all quality and test gates
        id: verify
        run: npm run verify:ci
      - name: Upload test, coverage and browser diagnostics
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web1-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web1/test-reports/
            apps/web1/coverage/
            apps/web1/playwright-report/
            apps/web1/test-results/
          if-no-files-found: error
          retention-days: 7
      - name: Record verification outcome without granting merge acceptance
        if: ${{ !cancelled() }}
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf '### web1 verification\nSource: `%s`\nVerification step: `%s`\n' "$SOURCE_SHA" "$VERIFY_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          printf 'Skipped/not-run checks are not passing test evidence. Artifacts are diagnostics, not merge receipts.\n' >> "$GITHUB_STEP_SUMMARY"
